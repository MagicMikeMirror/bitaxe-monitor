name: bitaxe-monitor

services:
  bitaxe-monitor:
    image: ghcr.io/magicmikemirror/bitaxe-monitor:1.2.3
    container_name: bitaxe-monitor
    restart: unless-stopped
    environment:
      BITAXE_API_URL: ${BITAXE_API_URL:-http://192.168.1.100/api/system/info}
      DB_PATH: /data/bitaxe.sqlite3
      POLL_SECONDS: ${POLL_SECONDS:-10}
      PORT: "8080"
      PUBLIC_POOL_API_URL: ${PUBLIC_POOL_API_URL:-https://public-pool.io:40557/api}
      BTC_PRICE_URL: ${BTC_PRICE_URL:-https://api.coinbase.com/v2/prices/BTC-EUR/spot}
      BTC_HISTORY_URL: ${BTC_HISTORY_URL:-https://api.exchange.coinbase.com/products/BTC-EUR/candles?granularity=3600}
      MARKET_SECONDS: ${MARKET_SECONDS:-300}
      OFFLINE_AFTER_POLLS: ${OFFLINE_AFTER_POLLS:-3}
      RECOVERY_POLLS: ${RECOVERY_POLLS:-3}
      STALL_AFTER_POLLS: ${STALL_AFTER_POLLS:-3}
      IDLE_POWER_W: ${IDLE_POWER_W:-8}
      VOLTAGE_LOW_V: ${VOLTAGE_LOW_V:-4.75}
      EXPECTED_HASHRATE_GH: ${EXPECTED_HASHRATE_GH:-0}
      AUTO_RESTART_ENABLED: ${AUTO_RESTART_ENABLED:-false}
      AUTO_RESTART_THRESHOLD_PCT: ${AUTO_RESTART_THRESHOLD_PCT:-70}
      AUTO_RESTART_AFTER_SECONDS: ${AUTO_RESTART_AFTER_SECONDS:-600}
      AUTO_RESTART_MIN_UPTIME_SECONDS: ${AUTO_RESTART_MIN_UPTIME_SECONDS:-900}
      AUTO_RESTART_COOLDOWN_SECONDS: ${AUTO_RESTART_COOLDOWN_SECONDS:-1800}
      AUTO_RESTART_VERIFY_SECONDS: ${AUTO_RESTART_VERIFY_SECONDS:-900}
    ports:
      - "${DASHBOARD_PORT:-8787}:8080"
    volumes:
      - /DATA/AppData/bitaxe-monitor/data:/data
    security_opt:
      - no-new-privileges:true

x-casaos:
  id: io.github.magicmikemirror.bitaxe-monitor
  main: bitaxe-monitor
  index: /
  port_map: "8787"
  scheme: http
  icon: icon.svg
  title:
    en_US: Bitaxe Monitor
    de_DE: Bitaxe Monitor
  tagline:
    en_US: Private local monitoring for Bitaxe and AxeOS miners
    de_DE: Privates lokales Monitoring für Bitaxe- und AxeOS-Miner
  description:
    en_US: Lightweight single-container Bitaxe dashboard with SQLite history, responsive charts, health status and event detection. It stores only an explicit allow-list of telemetry fields and never stores wallet, pool credentials or raw API responses.
    de_DE: Schlankes Bitaxe-Dashboard als einzelner Container mit SQLite-Verlauf, responsiven Diagrammen, Health-Status und Ereigniserkennung. Es speichert ausschließlich eine feste Positivliste von Messwerten und niemals Wallet-, Pool-Zugangsdaten oder rohe API-Antworten.
  tips:
    before_install:
      en_US: Set BITAXE_API_URL to the AxeOS system-info endpoint of your miner before installing.
      de_DE: Vor der Installation BITAXE_API_URL auf den AxeOS-system-info-Endpunkt des eigenen Miners setzen.
  author: MagicMikeMirror
  developer: Bitaxe Monitor contributors
  category: Finance
  architectures: [amd64, arm64]
  version: "1.2.3"
  update_at: "2026-09-20"
  website: https://github.com/MagicMikeMirror/bitaxe-monitor
  repo: https://github.com/MagicMikeMirror/bitaxe-monitor
  support: https://github.com/MagicMikeMirror/bitaxe-monitor/issues
  docs: https://github.com/MagicMikeMirror/bitaxe-monitor#readme
  release_notes:
    en_US: Keeps 1h, 24h and 7d history continuous across miner and container restarts.
    de_DE: Hält 1h-, 24h- und 7d-Historie über Miner- und Container-Neustarts hinweg durchgehend.
